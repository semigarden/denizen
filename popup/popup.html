<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discord Translate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <h1 class="popup__brand">Discord Translate</h1>
        <label class="popup__toggle" title="Enable extension">
          <input type="checkbox" id="enabledToggle" />
          <span class="popup__toggle-ui" aria-hidden="true"></span>
          <span class="visually-hidden">Enable extension</span>
        </label>
      </header>
      <div class="popup__field">
        <span class="popup__label" id="incomingLabel">Incoming</span>
        <div class="lang-combobox" id="incomingCombobox">
          <input
            id="incomingSearch"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search languages"
            aria-labelledby="incomingLabel"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="incomingList"
          />
          <div class="lang-combobox__panel">
            <div class="lang-combobox__panel-inner">
              <ul id="incomingList" class="lang-combobox__list" role="listbox"></ul>
            </div>
          </div>
        </div>
      </div>
      <div class="popup__field">
        <span class="popup__label" id="outgoingLabel">Outgoing</span>
        <div class="lang-combobox" id="outgoingCombobox">
          <input
            id="outgoingSearch"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search languages"
            aria-labelledby="outgoingLabel"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="outgoingList"
          />
          <div class="lang-combobox__panel">
            <div class="lang-combobox__panel-inner">
              <ul id="outgoingList" class="lang-combobox__list" role="listbox"></ul>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
