<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Settings</h1>

      <form id="settings-form">
        <label class="row check">
          <input type="checkbox" id="enabled" />
          <span>Enable Translation</span>
        </label>

        <label class="row check">
          <input type="checkbox" id="translateIncoming" />
          <span>Translate incoming messages</span>
        </label>

        <label class="row check">
          <input type="checkbox" id="translateOutgoing" />
          <span>Show draft preview</span>
        </label>

        <label class="row">
          <span>My language</span>
          <select id="myLanguage"></select>
        </label>

        <label class="row">
          <span>Translate language</span>
          <select id="targetLanguage"></select>
        </label>

        <label class="row">
          <span>Provider</span>
          <select id="provider">
            <option value="libretranslate">LibreTranslate</option>
            <option value="deepl">DeepL</option>
          </select>
        </label>

        <div id="libre-fields" hidden>
          <label class="row">
            <span>LibreTranslate URL</span>
            <input type="url" id="libreUrl" spellcheck="false" placeholder="http://127.0.0.1:5000" />
          </label>
          <!-- <label class="row">
            <span>LibreTranslate API key (optional)</span>
            <input type="password" id="libreApiKey" autocomplete="off" spellcheck="false" />
          </label> -->
        </div>

        <div id="deepl-fields">
          <label class="row">
            <span>DeepL API key</span>
            <input type="password" id="apiKey" autocomplete="off" spellcheck="false" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx:fx" />
          </label>
        </div>

        <p class="hint" id="perm-hint">
          Firefox Android needs site access granted or Discord translations won't run
        </p>

        <div class="actions">
          <button type="button" id="grant-btn">Grant site access</button>
          <button type="submit" id="save-btn">Save</button>
        </div>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
